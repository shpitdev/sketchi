interface:
  display_name: "Sketchi Code Mode"
  short_description: "Draw editable diagrams with Sketchi"
  icon_small: "./assets/codex.svg"
  icon_large: "./assets/mcp.svg"
  brand_color: "#2F6FED"
  default_prompt: "Use $sketchi-code-mode to draw our release approval flow as a flowchart."

dependencies:
  tools:
    - type: "mcp"
      value: "sketchi-code-mode"
      description: "Remote Sketchi Code Mode MCP server"
      transport: "streamable_http"
      url: "https://playground.sketchi.app/mcp"

policy:
  allow_implicit_invocation: true
