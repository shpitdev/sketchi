name: v2-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @sketchi/backend exec playwright install --with-deps chromium

      - run: pnpm nx run-many -t typecheck,test,build

      - run: pnpm nx run-many -t typecheck-tsgo

      - run: pnpm nx test-storybook diagram-studio-ui

      - run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.json
