name: v2-ci

on:
  pull_request:
  push:
    branches:
      - main
      - rewrite/**

jobs:
  optimize_ci:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check_skip.outputs.skip }}
    steps:
      - name: Optimize CI
        id: check_skip
        uses: withgraphite/graphite-ci-action@main
        with:
          github_token: ${{ github.token }}
          graphite_token: ${{ secrets.GRAPHITE_TOKEN }}
          pr_number: ${{ github.event.pull_request.number || '' }}

  verify:
    needs: optimize_ci
    if: needs.optimize_ci.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v5
        with:
          version: 11.5.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:deploy-scripts
      - name: Resolve Nx affected refs
        id: nx-refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "base=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${PUSH_BEFORE_SHA:-}" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            echo "base=$PUSH_BEFORE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "base=origin/main" >> "$GITHUB_OUTPUT"
          fi
          echo "head=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Detect affected projects
        id: affected
        run: |
          set -euo pipefail
          mkdir -p .memory
          pnpm nx show projects --affected \
            --base="${{ steps.nx-refs.outputs.base }}" \
            --head="${{ steps.nx-refs.outputs.head }}" \
            | tee .memory/affected-projects.txt

          if grep -qx "native-conversion-storybook" .memory/affected-projects.txt; then
            echo "native_conversion_storybook=true" >> "$GITHUB_OUTPUT"
          else
            echo "native_conversion_storybook=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(svg-excalidraw|excalidraw)$' .memory/affected-projects.txt; then
            echo "playwright=true" >> "$GITHUB_OUTPUT"
            echo "svg_corpus=true" >> "$GITHUB_OUTPUT"
          else
            echo "playwright=false" >> "$GITHUB_OUTPUT"
            echo "svg_corpus=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Chromium for browser tests
        if: ${{ steps.affected.outputs.playwright == 'true' }}
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm nx affected -t typecheck,test,build --base="${{ steps.nx-refs.outputs.base }}" --head="${{ steps.nx-refs.outputs.head }}"
      - name: Run affected SVG corpus renderer
        if: ${{ steps.affected.outputs.svg_corpus == 'true' }}
        run: pnpm nx run svg-excalidraw:corpus-renderer
      - name: Upload SVG corpus renderer report
        if: ${{ always() && steps.affected.outputs.svg_corpus == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: svg-native-corpus-${{ github.event.pull_request.head.sha || github.sha }}
          path: .memory/svg-native-corpus
          if-no-files-found: error
      - run: pnpm nx affected -t build-storybook --base="${{ steps.nx-refs.outputs.base }}" --head="${{ steps.nx-refs.outputs.head }}"
      - name: Publish native conversion Storybook to Chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' && steps.affected.outputs.native_conversion_storybook == 'true' }}
        env:
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHROMATIC_SLUG: ${{ github.repository }}
        run: pnpm nx chromatic native-conversion-storybook -- --exit-zero-on-changes
