name: app-production-deploy
run-name: ${{ github.event_name == 'workflow_dispatch' && format('production {0} {1}', inputs.domain_action, inputs.project) || format('production deploy at {0}', github.sha) }}

on:
  push:
    branches:
      - main
    # Every workspace package, the root files Nx counts as build inputs, and the repository scripts
    # Worker builds import (each app's `build` inputs list them). A push outside these (docs, CI,
    # other scripts) cannot reach a Worker build, so it starts nothing.
    paths:
      - "apps/**"
      - "packages/**"
      - "tools/**"
      - "scripts/lib/excalidraw-fonts.mjs"
      - "scripts/lib/worker-apps.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nx.json"
      - "tsconfig.base.json"
      - ".oxlintrc.json"
  workflow_dispatch:
    inputs:
      project:
        description: Nx project to deploy.
        required: true
        default: all
        type: choice
        options:
          - all
          - playground
          - web
          - excalidraw
          - icons
      domain_action:
        description: Post-merge production domain action.
        required: true
        default: none
        type: choice
        options:
          - none
          - attach
          - detach

env:
  NX_DAEMON: "false"
  NX_TUI: "false"

jobs:
  # A push deploys only the Worker apps whose build it reaches, including through a shared
  # package; a dispatch deploys every app or the one it names.
  select:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The selection compares this push with the previous main commit.
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace
        with:
          install-dependencies: ${{ github.event_name == 'push' }}

      - name: Select the Worker apps to deploy
        id: projects
        env:
          PRODUCTION_SELECTION: ${{ inputs.project || 'affected' }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/09-select-production-projects.mjs

  deploy:
    needs: select
    if: needs.select.outputs.projects != '[]'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.select.outputs.projects) }}
    concurrency:
      # Shared with PR previews, including uploads bound to different Pipeline streams.
      group: ${{ matrix.project == 'playground' && 'cloudflare-pipeline-bound-upload' || format('app-production-{0}', matrix.project) }}
      cancel-in-progress: false
      queue: ${{ matrix.project == 'playground' && 'max' || 'single' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/setup-workspace

      - name: Resolve Worker project and identity
        id: worker-app
        env:
          WORKER_PROJECT: ${{ matrix.project }}
        run: node scripts/00-resolve-worker-app.mjs --project "$WORKER_PROJECT"

      - run: pnpm nx build "${{ steps.worker-app.outputs.project_id }}"

      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Cloudflare production deploy credentials are not configured. Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN."

      - name: Deploy production Worker
        id: deploy
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_ID: ${{ steps.worker-app.outputs.project_id }}
          WORKER_NAME: ${{ steps.worker-app.outputs.worker_name }}
        run: |
          set -euo pipefail
          mkdir -p .memory
          node scripts/07-wrangler-retry.mjs -- pnpm exec wrangler deploy \
            --config "${{ steps.worker-app.outputs.worker_config_path }}" \
            --no-x-provision \
            --message "project ${PROJECT_ID} Worker ${WORKER_NAME} production ${{ github.sha }}" \
            2>&1 | tee ".memory/wrangler-${{ matrix.project }}-production-deploy.log"

      - name: Extract workers.dev URL
        id: workers-dev-url
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        run: |
          node scripts/02-extract-preview-url.mjs \
            ".memory/wrangler-${{ matrix.project }}-production-deploy.log" \
            --worker-name "${{ steps.worker-app.outputs.worker_name }}"

      - name: Summarize production Worker
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        env:
          PROJECT_ID: ${{ matrix.project }}
          WORKER_NAME: ${{ steps.worker-app.outputs.worker_name }}
        run: |
          {
            echo "### ${{ matrix.project }} production project"
            echo ""
            echo "- Worker: \`${{ steps.worker-app.outputs.worker_name }}\`"
            echo "- workers.dev URL: ${{ steps.workers-dev-url.outputs.preview_url }}"
            node --input-type=module <<'NODE'
          import { productionProjectConfig } from "./scripts/lib/deploy/production.mjs";
          import { requireWorkerIdentity } from "./scripts/lib/worker-apps.mjs";

          const project = productionProjectConfig(process.env.PROJECT_ID);
          requireWorkerIdentity(project.projectId, process.env.WORKER_NAME);
          const visibility = project.publicSurface
            ? "public product surface"
            : "internal surface; not linked from public navigation";
          const domains =
            project.domainPatterns.length > 0
              ? `${project.domainPatterns.join(", ")} (manual attach only)`
              : "none";

          console.log(`- Project ID: \`${project.projectId}\``);
          console.log(`- Worker identity: \`${project.workerName}\``);
          console.log(`- Visibility: ${visibility}`);
          console.log(`- Route policy: ${project.routePolicy}`);
          console.log(`- Custom domains: ${domains}`);
          NODE
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare production domain Wrangler config
        id: domains
        if: ${{ steps.credentials.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && inputs.domain_action == 'attach' }}
        env:
          PROJECT_ID: ${{ matrix.project }}
        run: >-
          node scripts/05-prepare-production-domain-deploy.mjs
          --project "$PROJECT_ID"
          --config "${{ steps.worker-app.outputs.worker_config_path }}"

      - name: Require an active Cloudflare zone before domain attach
        if: ${{ steps.credentials.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && inputs.domain_action == 'attach' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/zones?name=sketchi.app&account.id=${CLOUDFLARE_ACCOUNT_ID}"
          )"
          RESPONSE="$response" node --input-type=module <<'NODE'
          const payload = JSON.parse(process.env.RESPONSE ?? "{}");
          const zones = Array.isArray(payload.result) ? payload.result : [];
          if (payload.success !== true || zones.length !== 1 || zones[0]?.status !== "active") {
            throw new Error("sketchi.app must exist as one active Cloudflare zone before domain attachment.");
          }
          NODE

      - name: Attach production domains
        if: ${{ steps.credentials.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && inputs.domain_action == 'attach' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/07-wrangler-retry.mjs -- pnpm exec wrangler deploy \
            --config "${{ steps.domains.outputs.domain_config_path }}" \
            --no-x-provision \
            --message "project ${{ steps.worker-app.outputs.project_id }} Worker ${{ steps.worker-app.outputs.worker_name }} production domain attach ${{ github.sha }}"

      - name: Detach production domains
        if: ${{ steps.credentials.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && inputs.domain_action == 'detach' }}
        env:
          PROJECT_ID: ${{ matrix.project }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/06-detach-production-domains.mjs --project "$PROJECT_ID" --apply
