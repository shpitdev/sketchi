name: app-production-deploy
run-name: ${{ github.event_name == 'workflow_dispatch' && format('production {0} {1}', inputs.domain_action, inputs.project) || format('production deploy all at {0}', github.sha) }}

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nx.json"
      - "tsconfig.base.json"
  workflow_dispatch:
    inputs:
      project:
        description: Nx project to deploy.
        required: true
        default: all
        type: choice
        options:
          - all
          - eval-harness
          - playground
          - web
          - excalidraw
          - icons
      domain_action:
        description: Post-merge production domain action.
        required: true
        default: none
        type: choice
        options:
          - none
          - attach
          - detach

env:
  NX_DAEMON: "false"
  NX_TUI: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        project:
          - eval-harness
          - playground
          - web
          - excalidraw
          - icons
    concurrency:
      group: app-production-${{ matrix.project }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        if: ${{ github.event_name == 'push' || inputs.project == 'all' || inputs.project == matrix.project }}

      - uses: pnpm/action-setup@v5
        if: ${{ github.event_name == 'push' || inputs.project == 'all' || inputs.project == matrix.project }}
        with:
          version: 11.5.0

      - uses: actions/setup-node@v6
        if: ${{ github.event_name == 'push' || inputs.project == 'all' || inputs.project == matrix.project }}
        with:
          node-version: 24
          cache: pnpm

      - if: ${{ github.event_name == 'push' || inputs.project == 'all' || inputs.project == matrix.project }}
        run: pnpm install --frozen-lockfile

      - if: ${{ github.event_name == 'push' || inputs.project == 'all' || inputs.project == matrix.project }}
        run: pnpm run test:deploy-scripts

      - name: Resolve Worker project and identity
        id: worker-app
        if: ${{ github.event_name == 'push' || inputs.project == 'all' || inputs.project == matrix.project }}
        env:
          WORKER_PROJECT: ${{ matrix.project }}
        run: node scripts/00-resolve-worker-app.mjs --project "$WORKER_PROJECT"

      - if: ${{ github.event_name == 'push' || inputs.project == 'all' || inputs.project == matrix.project }}
        run: pnpm nx build "${{ steps.worker-app.outputs.project_id }}"

      - name: Check Cloudflare credentials
        id: credentials
        if: ${{ github.event_name == 'push' || inputs.project == 'all' || inputs.project == matrix.project }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Cloudflare production deploy credentials are not configured. Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN."

      - name: Deploy production Worker
        id: deploy
        if: ${{ steps.credentials.outputs.configured == 'true' && (github.event_name == 'push' || inputs.project == 'all' || inputs.project == matrix.project) }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_ID: ${{ steps.worker-app.outputs.project_id }}
          WORKER_NAME: ${{ steps.worker-app.outputs.worker_name }}
        run: |
          set -euo pipefail
          mkdir -p .memory
          pnpm exec wrangler deploy \
            --config "${{ steps.worker-app.outputs.worker_config_path }}" \
            --no-x-provision \
            --message "project ${PROJECT_ID} Worker ${WORKER_NAME} production ${{ github.sha }}" \
            2>&1 | tee ".memory/wrangler-${{ matrix.project }}-production-deploy.log"

      - name: Extract workers.dev URL
        id: workers-dev-url
        if: ${{ steps.credentials.outputs.configured == 'true' && (github.event_name == 'push' || inputs.project == 'all' || inputs.project == matrix.project) }}
        run: |
          node scripts/02-extract-preview-url.mjs \
            ".memory/wrangler-${{ matrix.project }}-production-deploy.log" \
            --worker-name "${{ steps.worker-app.outputs.worker_name }}"

      - name: Summarize production Worker
        if: ${{ steps.credentials.outputs.configured == 'true' && (github.event_name == 'push' || inputs.project == 'all' || inputs.project == matrix.project) }}
        env:
          PROJECT_ID: ${{ matrix.project }}
          WORKER_NAME: ${{ steps.worker-app.outputs.worker_name }}
        run: |
          {
            echo "### ${{ matrix.project }} production project"
            echo ""
            echo "- Worker: \`${{ steps.worker-app.outputs.worker_name }}\`"
            echo "- workers.dev URL: ${{ steps.workers-dev-url.outputs.preview_url }}"
            node --input-type=module <<'NODE'
          import { productionProjectConfig } from "./scripts/lib/production-deploy.mjs";
          import { requireWorkerIdentity } from "./scripts/lib/worker-apps.mjs";

          const project = productionProjectConfig(process.env.PROJECT_ID);
          requireWorkerIdentity(project.projectId, process.env.WORKER_NAME);
          const visibility = project.publicSurface
            ? "public product surface"
            : "internal surface; not linked from public navigation";
          const domains =
            project.domainPatterns.length > 0
              ? `${project.domainPatterns.join(", ")} (manual attach only)`
              : "none";

          console.log(`- Project ID: \`${project.projectId}\``);
          console.log(`- Worker identity: \`${project.workerName}\``);
          console.log(`- Visibility: ${visibility}`);
          console.log(`- Route policy: ${project.routePolicy}`);
          console.log(`- Custom domains: ${domains}`);
          NODE
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare production domain Wrangler config
        id: domains
        if: ${{ steps.credentials.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && inputs.domain_action == 'attach' && (inputs.project == 'all' || inputs.project == matrix.project) }}
        env:
          PROJECT_ID: ${{ matrix.project }}
        run: >-
          node scripts/05-prepare-production-domain-deploy.mjs
          --project "$PROJECT_ID"
          --config "${{ steps.worker-app.outputs.worker_config_path }}"

      - name: Require an active Cloudflare zone before domain attach
        if: ${{ steps.credentials.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && inputs.domain_action == 'attach' && (inputs.project == 'all' || inputs.project == matrix.project) }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/zones?name=sketchi.app&account.id=${CLOUDFLARE_ACCOUNT_ID}"
          )"
          RESPONSE="$response" node --input-type=module <<'NODE'
          const payload = JSON.parse(process.env.RESPONSE ?? "{}");
          const zones = Array.isArray(payload.result) ? payload.result : [];
          if (payload.success !== true || zones.length !== 1 || zones[0]?.status !== "active") {
            throw new Error("sketchi.app must exist as one active Cloudflare zone before domain attachment.");
          }
          NODE

      - name: Attach production domains
        if: ${{ steps.credentials.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && inputs.domain_action == 'attach' && (inputs.project == 'all' || inputs.project == matrix.project) }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler deploy \
            --config "${{ steps.domains.outputs.domain_config_path }}" \
            --no-x-provision \
            --message "project ${{ steps.worker-app.outputs.project_id }} Worker ${{ steps.worker-app.outputs.worker_name }} production domain attach ${{ github.sha }}"

      - name: Detach production domains
        if: ${{ steps.credentials.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && inputs.domain_action == 'detach' && (inputs.project == 'all' || inputs.project == matrix.project) }}
        env:
          PROJECT_ID: ${{ matrix.project }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/06-detach-production-domains.mjs --project "$PROJECT_ID" --apply
