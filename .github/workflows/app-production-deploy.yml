name: app-production-deploy
run-name: production ${{ inputs.domain_action }} ${{ inputs.project }}

on:
  workflow_dispatch:
    inputs:
      project:
        description: Nx project to deploy.
        required: true
        default: all
        type: choice
        options:
          - all
          - playground
          - web
          - excalidraw
          - icons
      domain_action:
        description: Post-merge production domain action.
        required: true
        default: none
        type: choice
        options:
          - none
          - attach
          - detach

env:
  NX_DAEMON: "false"
  NX_TUI: "false"

jobs:
  # A dispatch deploys every app or the one it names.
  select:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/setup-workspace

      - name: Select the Worker apps to deploy
        id: projects
        env:
          PRODUCTION_SELECTION: ${{ inputs.project }}
        run: pnpm --silent ops production select --project "$PRODUCTION_SELECTION"

  deploy:
    needs: select
    if: needs.select.outputs.projects != '[]'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.select.outputs.projects) }}
    concurrency:
      # Shared with PR previews, including uploads bound to different Pipeline streams.
      group: ${{ (matrix.project == 'playground' || matrix.project == 'icons') && 'cloudflare-pipeline-bound-upload' || format('app-production-{0}', matrix.project) }}
      cancel-in-progress: false
      queue: ${{ (matrix.project == 'playground' || matrix.project == 'icons') && 'max' || 'single' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/setup-workspace

      - name: Resolve Worker project and identity
        id: worker-app
        env:
          WORKER_PROJECT: ${{ matrix.project }}
        run: pnpm --silent ops worker resolve --project "$WORKER_PROJECT"

      - run: pnpm nx build "${{ steps.worker-app.outputs.project_id }}"

      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Cloudflare production deploy credentials are not configured. Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN."

      - name: Deploy production Worker
        id: deploy
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_ID: ${{ steps.worker-app.outputs.project_id }}
          WORKER_NAME: ${{ steps.worker-app.outputs.worker_name }}
        run: |
          set -euo pipefail
          mkdir -p .memory
          pnpm --silent ops wrangler-retry -- pnpm exec wrangler deploy \
            --config "${{ steps.worker-app.outputs.worker_config_path }}" \
            --no-x-provision \
            --message "project ${PROJECT_ID} Worker ${WORKER_NAME} production ${{ github.sha }}" \
            2>&1 | tee ".memory/wrangler-${{ matrix.project }}-production-deploy.log"

      - name: Extract workers.dev URL
        id: workers-dev-url
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        run: |
          pnpm --silent ops production url \
            ".memory/wrangler-${{ matrix.project }}-production-deploy.log" \
            --worker-name "${{ steps.worker-app.outputs.worker_name }}"

      - name: Summarize production Worker
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        env:
          PROJECT_ID: ${{ matrix.project }}
          WORKER_NAME: ${{ steps.worker-app.outputs.worker_name }}
        run: |
          {
            echo "### ${{ matrix.project }} production project"
            echo ""
            echo "- Worker: \`${{ steps.worker-app.outputs.worker_name }}\`"
            echo "- workers.dev URL: ${{ steps.workers-dev-url.outputs.preview_url }}"
            pnpm --silent ops production summary --project "$PROJECT_ID" --worker-name "$WORKER_NAME"
          } >> "$GITHUB_STEP_SUMMARY"

      # Requires sketchi.app as one active Cloudflare zone before anything attaches.
      - name: Prepare production domain Wrangler config
        id: domains
        if: ${{ steps.credentials.outputs.configured == 'true' && inputs.domain_action == 'attach' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_ID: ${{ matrix.project }}
        run: >-
          pnpm --silent ops production domains
          --project "$PROJECT_ID"
          --config "${{ steps.worker-app.outputs.worker_config_path }}"

      - name: Attach production domains
        if: ${{ steps.credentials.outputs.configured == 'true' && inputs.domain_action == 'attach' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --silent ops wrangler-retry -- pnpm exec wrangler deploy \
            --config "${{ steps.domains.outputs.domain_config_path }}" \
            --no-x-provision \
            --message "project ${{ steps.worker-app.outputs.project_id }} Worker ${{ steps.worker-app.outputs.worker_name }} production domain attach ${{ github.sha }}"

      - name: Detach production domains
        if: ${{ steps.credentials.outputs.configured == 'true' && inputs.domain_action == 'detach' }}
        env:
          PROJECT_ID: ${{ matrix.project }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --silent ops production detach --project "$PROJECT_ID" --apply
