name: ci

# The thin remote check: a typecheck of the Nx-affected graph, which also catches a bad merge
# with the base. Lint, tests, builds, Storybook and the repository contracts run locally in
# `pnpm ci:local`, which signs off the PR head as `local-ci` (see AGENTS.md).
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_DAEMON: "false"
  NX_TUI: "false"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-workspace
      - name: Typecheck affected projects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm nx affected -t typecheck --base="$(git merge-base "$BASE_SHA" HEAD)" --head=HEAD --outputStyle=static
