name: app-preview

# Previews are opt-in. A same-repository PR labelled `preview` deploys the Worker apps it affects
# on every push; a dispatch previews any open same-repository PR, including a stacked one, and
# labels it. Closing a PR deletes its Previews whenever it has the label or a preview comment.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR number to preview.
        required: true
      project:
        description: Worker apps to preview.
        required: true
        default: affected
        type: choice
        options:
          - affected
          - all
          - eval-harness
          - playground
          - web
          - excalidraw
          - icons

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  NX_DAEMON: "false"
  NX_TUI: "false"

jobs:
  resolve-preview-pr:
    # Without the label, only closing runs (cleanup). Adding some other label runs nothing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action == 'closed' ||
          (contains(github.event.pull_request.labels.*.name, 'preview') &&
            (github.event.action != 'labeled' || github.event.label.name == 'preview'))))
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      sha: ${{ steps.pr.outputs.sha }}
      projects: ${{ steps.projects.outputs.projects }}
      cleanup: ${{ steps.existing.outputs.cleanup }}
    steps:
      - name: Resolve preview PR identity
        id: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PREVIEW_ACTION: ${{ github.event.action == 'closed' && 'cleanup' || 'deploy' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          const input = process.env.PR_NUMBER ?? "";
          const prNumber = Number(input);
          if (!input || /[^0-9]/.test(input) || !Number.isSafeInteger(prNumber) || prNumber < 1) {
            throw new Error("PR number must be a positive integer within the safe integer range.");
          }
          const repository = process.env.GITHUB_REPOSITORY;
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${repository}/pulls/${prNumber}`, {
            headers: {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              "X-GitHub-Api-Version": "2022-11-28",
            },
          });
          if (!response.ok) {
            throw new Error(`PR lookup failed with HTTP ${response.status}.`);
          }
          const pr = await response.json();
          if (pr.head?.repo?.full_name !== repository) {
            throw new Error("Preview operations require a same-repository PR.");
          }
          if (process.env.PREVIEW_ACTION === "deploy" && pr.state !== "open") {
            throw new Error("Preview deploy requires an open PR.");
          }
          const sha = process.env.EVENT_HEAD_SHA || pr.head.sha;
          if (typeof sha !== "string" || !/^[a-f0-9]{40}$/.test(sha)) {
            throw new Error("PR head SHA is missing or invalid.");
          }
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `pr_number=${prNumber}\nsha=${sha}\nbase_sha=${pr.base.sha}\n`,
          );
          NODE

      # A dispatched Preview labels its PR before anything uploads, so a close always finds the
      # label, even one before the first Preview comment. The deploy re-checks that the PR is
      # open after this. A label added with the workflow token starts no run of its own.
      - name: Label the PR for cleanup
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" -f "labels[]=preview" --silent

      # Previews are opt-in, so most closed PRs have none. One may exist when the PR carries the
      # `preview` label or a preview comment, however it was deployed (including before opt-in).
      - name: Detect an existing Preview
        id: existing
        if: github.event.action == 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_PREVIEW_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'preview') }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ "$HAS_PREVIEW_LABEL" = true ]; then
            echo "cleanup=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export COMMENTS_FILE="$RUNNER_TEMP/preview-comments.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" > "$COMMENTS_FILE"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          // The sticky comment scripts/03-upsert-preview-comment.mjs owns for each app.
          const marker = /<!-- sketchi-[a-z-]+-preview -->/;
          const found = JSON.parse(readFileSync(process.env.COMMENTS_FILE, "utf8"))
            .flat()
            .some(({ user, body }) => user?.login === "github-actions[bot]" && marker.test(body ?? ""));
          if (!found) {
            console.log(`PR #${process.env.PR_NUMBER} never had a Preview; nothing to clean up.`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `cleanup=${found}\n`);
          NODE

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event.action != 'closed'
        with:
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.sha }}

      - uses: ./.github/actions/setup-workspace
        if: github.event.action != 'closed'

      - name: Select the Worker apps to preview
        id: projects
        if: github.event.action != 'closed'
        env:
          PREVIEW_SELECTION: ${{ inputs.project || 'affected' }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: node scripts/08-select-preview-projects.mjs

  deploy-preview:
    needs: resolve-preview-pr
    if: >-
      github.event.action != 'closed' &&
      needs.resolve-preview-pr.outputs.projects != '[]'
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.resolve-preview-pr.outputs.projects) }}
    concurrency:
      # Serialize Pipeline-bound uploads across Workers and streams in this account.
      # Use the same queued lock as production; leave other apps PR-scoped.
      group: ${{ matrix.project == 'playground' && 'cloudflare-pipeline-bound-upload' || format('app-preview-{0}-pr-{1}', matrix.project, needs.resolve-preview-pr.outputs.pr_number) }}
      cancel-in-progress: ${{ matrix.project != 'playground' }}
      queue: ${{ matrix.project == 'playground' && 'max' || 'single' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve-preview-pr.outputs.sha }}

      - uses: ./.github/actions/setup-workspace

      - name: Resolve Worker project and identity
        id: worker-app
        env:
          WORKER_PROJECT: ${{ matrix.project }}
        run: node scripts/00-resolve-worker-app.mjs --project "$WORKER_PROJECT"

      - run: pnpm nx build "${{ steps.worker-app.outputs.project_id }}"

      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Cloudflare preview deploy credentials are not configured. Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN."

      - name: Read workers.dev subdomain
        if: steps.credentials.outputs.configured == 'true' && matrix.project == 'web'
        id: workers-subdomain
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          )"
          subdomain="$(
            RESPONSE="$response" node --input-type=module <<'NODE'
          const response = JSON.parse(process.env.RESPONSE ?? "{}");
          const subdomain = response?.result?.subdomain;

          if (!response.success || typeof subdomain !== "string" || subdomain.length === 0) {
            throw new Error(`Cloudflare workers.dev subdomain lookup failed: ${JSON.stringify(response.errors ?? [])}`);
          }

          process.stdout.write(subdomain);
          NODE
          )"
          echo "workers_dev_subdomain=${subdomain}" >> "$GITHUB_OUTPUT"

      - name: Validate explicit Preview settings
        id: preview-settings
        env:
          CF_PREVIEW_WORKERS_SUBDOMAIN: ${{ steps.workers-subdomain.outputs.workers_dev_subdomain }}
          PREVIEW_PROJECT_ID: ${{ matrix.project }}
          PR_NUMBER: ${{ needs.resolve-preview-pr.outputs.pr_number }}
        run: >-
          node scripts/01-validate-preview-config.mjs
          --project "$PREVIEW_PROJECT_ID"
          --pr-number "$PR_NUMBER"
          --config "${{ steps.worker-app.outputs.worker_config_path }}"

      - name: Comment unconfigured preview
        if: steps.credentials.outputs.configured != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_PROJECT_ID: ${{ matrix.project }}
          PR_NUMBER: ${{ needs.resolve-preview-pr.outputs.pr_number }}
          PREVIEW_STATUS: unconfigured
          PREVIEW_SHA: ${{ needs.resolve-preview-pr.outputs.sha }}
          PREVIEW_NAME: ${{ steps.preview-settings.outputs.preview_name }}
        run: node scripts/03-upsert-preview-comment.mjs

      - name: Re-check PR is open
        if: steps.credentials.outputs.configured == 'true'
        id: still-open
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve-preview-pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          # This job holds its concurrency lock now. If the PR closed while it was
          # queued, cleanup may already have run, so deploying would recreate the Preview.
          state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .state)"
          if [ "$state" = open ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #${PR_NUMBER} is ${state}; skipping the Preview deploy."
          fi

      - name: Deploy official Worker Preview
        if: steps.credentials.outputs.configured == 'true' && steps.still-open.outputs.open == 'true'
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_ID: ${{ matrix.project }}
          WORKER_NAME: ${{ steps.worker-app.outputs.worker_name }}
          WRANGLER_OUTPUT_FILE_PATH: .memory/wrangler-${{ matrix.project }}-preview.ndjson
          # Web links a sibling's Preview only when this run deploys it; otherwise production.
          ICONS_PREVIEW_URL: ${{ contains(fromJSON(needs.resolve-preview-pr.outputs.projects), 'icons') && steps.preview-settings.outputs.icons_preview_url || '' }}
          PLAYGROUND_PREVIEW_URL: ${{ contains(fromJSON(needs.resolve-preview-pr.outputs.projects), 'playground') && steps.preview-settings.outputs.playground_preview_url || '' }}
        run: |
          set -euo pipefail
          mkdir -p .memory
          # CLI vars apply to the Preview only. They never rewrite production settings.
          preview_args=()
          if [ "$PROJECT_ID" = web ] && [ -n "$ICONS_PREVIEW_URL" ]; then
            preview_args+=(--var "SKETCHI_ICONS_URL:${ICONS_PREVIEW_URL}")
          fi
          if [ "$PROJECT_ID" = web ] && [ -n "$PLAYGROUND_PREVIEW_URL" ]; then
            preview_args+=(--var "SKETCHI_PLAYGROUND_URL:${PLAYGROUND_PREVIEW_URL}")
          fi
          # The retry wrapper clears WRANGLER_OUTPUT_FILE_PATH before each attempt.
          node scripts/07-wrangler-retry.mjs -- pnpm exec wrangler preview \
            --config "${{ steps.worker-app.outputs.worker_config_path }}" \
            --name "${{ steps.preview-settings.outputs.preview_name }}" \
            --ignore-base-config \
            "${preview_args[@]}" \
            --message "PR #${{ needs.resolve-preview-pr.outputs.pr_number }} project ${PROJECT_ID} Worker ${WORKER_NAME} preview ${{ needs.resolve-preview-pr.outputs.sha }}"

      - name: Extract preview URL
        if: steps.credentials.outputs.configured == 'true' && steps.still-open.outputs.open == 'true'
        id: preview-url
        run: |
          node scripts/02-extract-preview-url.mjs \
            ".memory/wrangler-${{ matrix.project }}-preview.ndjson" \
            --worker-name "${{ steps.worker-app.outputs.worker_name }}" \
            --preview-name "${{ steps.preview-settings.outputs.preview_name }}"

      - name: Comment preview URL
        if: steps.credentials.outputs.configured == 'true' && steps.still-open.outputs.open == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_PROJECT_ID: ${{ matrix.project }}
          PR_NUMBER: ${{ needs.resolve-preview-pr.outputs.pr_number }}
          PREVIEW_STATUS: ready
          PREVIEW_URL: ${{ steps.preview-url.outputs.preview_url }}
          PREVIEW_SHA: ${{ needs.resolve-preview-pr.outputs.sha }}
          PREVIEW_NAME: ${{ steps.preview-settings.outputs.preview_name }}
        run: node scripts/03-upsert-preview-comment.mjs

      - name: Comment preview failure
        if: failure() && steps.credentials.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_PROJECT_ID: ${{ matrix.project }}
          PR_NUMBER: ${{ needs.resolve-preview-pr.outputs.pr_number }}
          PREVIEW_STATUS: failed
          PREVIEW_SHA: ${{ needs.resolve-preview-pr.outputs.sha }}
          PREVIEW_NAME: ${{ steps.preview-settings.outputs.preview_name }}
        run: node scripts/03-upsert-preview-comment.mjs

  cleanup-preview:
    # Runs on a close whenever a Preview can exist, so none outlives its PR.
    needs: resolve-preview-pr
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.resolve-preview-pr.outputs.cleanup == 'true'
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        project:
          - eval-harness
          - playground
          - web
          - excalidraw
          - icons
    concurrency:
      # Same queue as deploy-preview. Deploys also re-check the PR state once they
      # hold the lock, so one that was waiting when the PR closed skips the upload.
      group: ${{ matrix.project == 'playground' && 'cloudflare-pipeline-bound-upload' || format('app-preview-{0}-pr-{1}', matrix.project, needs.resolve-preview-pr.outputs.pr_number) }}
      cancel-in-progress: ${{ matrix.project != 'playground' }}
      queue: ${{ matrix.project == 'playground' && 'max' || 'single' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve-preview-pr.outputs.sha }}

      - uses: ./.github/actions/setup-workspace
        with:
          install-dependencies: "false"

      - name: Delete official Worker Preview
        id: cleanup
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_PROJECT_ID: ${{ matrix.project }}
          PR_NUMBER: ${{ needs.resolve-preview-pr.outputs.pr_number }}
        # Fails, after recording `deletion-pending`, if the Preview URL keeps serving.
        run: node scripts/04-delete-preview.mjs --project "$PREVIEW_PROJECT_ID" --pr-number "$PR_NUMBER"

      - name: Comment preview cleanup
        if: ${{ !cancelled() && steps.cleanup.outputs.comment_status != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_PROJECT_ID: ${{ matrix.project }}
          PR_NUMBER: ${{ needs.resolve-preview-pr.outputs.pr_number }}
          PREVIEW_STATUS: ${{ steps.cleanup.outputs.comment_status }}
          PREVIEW_URL: ${{ steps.cleanup.outputs.comment_status == 'deletion-pending' && steps.cleanup.outputs.preview_url || '' }}
          PREVIEW_SHA: ${{ needs.resolve-preview-pr.outputs.sha }}
          PREVIEW_NAME: ${{ steps.cleanup.outputs.preview_name }}
        run: node scripts/03-upsert-preview-comment.mjs
