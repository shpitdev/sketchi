name: app-preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to deploy or clean up.
        required: true
      action:
        description: Deploy or cleanup.
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - cleanup

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  NX_DAEMON: "false"
  NX_TUI: "false"

jobs:
  resolve-preview-pr:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Resolve preview PR identity
        id: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PREVIEW_ACTION: ${{ github.event.action == 'closed' && 'cleanup' || inputs.action || 'deploy' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          const input = process.env.PR_NUMBER ?? "";
          const prNumber = Number(input);
          if (!input || /[^0-9]/.test(input) || !Number.isSafeInteger(prNumber) || prNumber < 1) {
            throw new Error("PR number must be a positive integer within the safe integer range.");
          }
          const repository = process.env.GITHUB_REPOSITORY;
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${repository}/pulls/${prNumber}`, {
            headers: {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              "X-GitHub-Api-Version": "2022-11-28",
            },
          });
          if (!response.ok) {
            throw new Error(`PR lookup failed with HTTP ${response.status}.`);
          }
          const pr = await response.json();
          if (pr.head?.repo?.full_name !== repository) {
            throw new Error("Preview operations require a same-repository PR.");
          }
          if (process.env.PREVIEW_ACTION === "deploy" && pr.state !== "open") {
            throw new Error("Preview deploy requires an open PR.");
          }
          const sha = process.env.EVENT_HEAD_SHA || pr.head.sha;
          if (typeof sha !== "string" || !/^[a-f0-9]{40}$/.test(sha)) {
            throw new Error("PR head SHA is missing or invalid.");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `pr_number=${prNumber}\nsha=${sha}\n`);
          NODE

  deploy-preview:
    needs: resolve-preview-pr
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        project:
          - eval-harness
          - playground
          - web
          - excalidraw
          - icons
    concurrency:
      group: app-preview-${{ matrix.project }}-pr-${{ needs.resolve-preview-pr.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve-preview-pr.outputs.sha }}

      - uses: ./.github/actions/setup-workspace

      - run: pnpm run test:deploy-scripts

      - name: Resolve Worker project and identity
        id: worker-app
        env:
          WORKER_PROJECT: ${{ matrix.project }}
        run: node scripts/00-resolve-worker-app.mjs --project "$WORKER_PROJECT"

      - run: pnpm nx build "${{ steps.worker-app.outputs.project_id }}"

      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Cloudflare preview deploy credentials are not configured. Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN."

      - name: Read workers.dev subdomain
        if: steps.credentials.outputs.configured == 'true' && matrix.project == 'web'
        id: workers-subdomain
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          )"
          subdomain="$(
            RESPONSE="$response" node --input-type=module <<'NODE'
          const response = JSON.parse(process.env.RESPONSE ?? "{}");
          const subdomain = response?.result?.subdomain;

          if (!response.success || typeof subdomain !== "string" || subdomain.length === 0) {
            throw new Error(`Cloudflare workers.dev subdomain lookup failed: ${JSON.stringify(response.errors ?? [])}`);
          }

          process.stdout.write(subdomain);
          NODE
          )"
          echo "workers_dev_subdomain=${subdomain}" >> "$GITHUB_OUTPUT"

      - name: Prepare preview Wrangler config
        id: prepare
        env:
          CF_PREVIEW_WORKERS_SUBDOMAIN: ${{ steps.workers-subdomain.outputs.workers_dev_subdomain }}
          PREVIEW_PROJECT_ID: ${{ matrix.project }}
          PR_NUMBER: ${{ needs.resolve-preview-pr.outputs.pr_number }}
        run: >-
          node scripts/01-prepare-preview-deploy.mjs
          --project "$PREVIEW_PROJECT_ID"
          --pr-number "$PR_NUMBER"
          --config "${{ steps.worker-app.outputs.worker_config_path }}"

      - name: Comment unconfigured preview
        if: steps.credentials.outputs.configured != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_PROJECT_ID: ${{ matrix.project }}
          PR_NUMBER: ${{ needs.resolve-preview-pr.outputs.pr_number }}
          PREVIEW_STATUS: unconfigured
          PREVIEW_SHA: ${{ needs.resolve-preview-pr.outputs.sha }}
          PREVIEW_WORKER_NAME: ${{ steps.prepare.outputs.preview_worker_name }}
        run: node scripts/03-upsert-preview-comment.mjs

      - name: Deploy preview Worker
        if: steps.credentials.outputs.configured == 'true'
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_ID: ${{ steps.prepare.outputs.project_id }}
          WORKER_NAME: ${{ steps.prepare.outputs.worker_name }}
        run: |
          set -euo pipefail
          mkdir -p .memory
          pnpm exec wrangler deploy \
            --config "${{ steps.prepare.outputs.preview_config_path }}" \
            --keep-vars \
            --no-x-provision \
            --message "PR #${{ needs.resolve-preview-pr.outputs.pr_number }} project ${PROJECT_ID} Worker ${WORKER_NAME} preview ${{ needs.resolve-preview-pr.outputs.sha }}" \
            2>&1 | tee ".memory/wrangler-${{ matrix.project }}-preview-deploy.log"

      - name: Extract preview URL
        if: steps.credentials.outputs.configured == 'true'
        id: preview-url
        run: |
          node scripts/02-extract-preview-url.mjs \
            ".memory/wrangler-${{ matrix.project }}-preview-deploy.log" \
            --worker-name "${{ steps.prepare.outputs.preview_worker_name }}"

      - name: Comment preview URL
        if: steps.credentials.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_PROJECT_ID: ${{ matrix.project }}
          PR_NUMBER: ${{ needs.resolve-preview-pr.outputs.pr_number }}
          PREVIEW_STATUS: ready
          PREVIEW_URL: ${{ steps.preview-url.outputs.preview_url }}
          PREVIEW_SHA: ${{ needs.resolve-preview-pr.outputs.sha }}
          PREVIEW_WORKER_NAME: ${{ steps.prepare.outputs.preview_worker_name }}
        run: node scripts/03-upsert-preview-comment.mjs

      - name: Comment preview failure
        if: failure() && steps.credentials.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_PROJECT_ID: ${{ matrix.project }}
          PR_NUMBER: ${{ needs.resolve-preview-pr.outputs.pr_number }}
          PREVIEW_STATUS: failed
          PREVIEW_SHA: ${{ needs.resolve-preview-pr.outputs.sha }}
          PREVIEW_WORKER_NAME: ${{ steps.prepare.outputs.preview_worker_name }}
        run: node scripts/03-upsert-preview-comment.mjs

  cleanup-preview:
    needs: resolve-preview-pr
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.action == 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'cleanup')
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        project:
          - eval-harness
          - playground
          - web
          - excalidraw
          - icons
    concurrency:
      group: app-preview-${{ matrix.project }}-pr-${{ needs.resolve-preview-pr.outputs.pr_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve-preview-pr.outputs.sha }}

      - uses: ./.github/actions/setup-workspace
        with:
          install-dependencies: "false"

      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Cloudflare preview cleanup credentials are not configured. Nothing was deleted."

      - name: Delete preview Worker
        if: steps.credentials.outputs.configured == 'true'
        id: cleanup
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_PROJECT_ID: ${{ matrix.project }}
          PR_NUMBER: ${{ needs.resolve-preview-pr.outputs.pr_number }}
        run: node scripts/04-delete-preview-worker.mjs --project "$PREVIEW_PROJECT_ID" --pr-number "$PR_NUMBER"

      - name: Comment preview cleanup
        if: steps.credentials.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_PROJECT_ID: ${{ matrix.project }}
          PR_NUMBER: ${{ needs.resolve-preview-pr.outputs.pr_number }}
          PREVIEW_STATUS: deleted
          PREVIEW_SHA: ${{ needs.resolve-preview-pr.outputs.sha }}
          PREVIEW_WORKER_NAME: ${{ steps.cleanup.outputs.preview_worker_name }}
        run: node scripts/03-upsert-preview-comment.mjs
