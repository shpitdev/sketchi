name: app-preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to deploy or clean up.
        required: true
      action:
        description: Deploy or cleanup.
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - cleanup

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  NX_DAEMON: "false"
  NX_TUI: "false"

jobs:
  optimize_ci:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check_skip.outputs.skip }}
    steps:
      - name: Optimize CI
        id: check_skip
        uses: withgraphite/graphite-ci-action@main
        with:
          github_token: ${{ github.token }}
          graphite_token: ${{ secrets.GRAPHITE_TOKEN }}
          pr_number: ${{ github.event.pull_request.number }}

  deploy-preview:
    needs: optimize_ci
    if: >-
      always() &&
      ((github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.optimize_ci.outputs.skip != 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'))
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        app:
          - playground
          - studio
          - web
          - excalidraw
          - icons
    concurrency:
      group: app-preview-${{ matrix.app }}-pr-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v5
        with:
          version: 11.5.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:deploy-scripts

      - run: pnpm nx build ${{ matrix.app }}

      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Cloudflare preview deploy credentials are not configured. Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN."

      - name: Read workers.dev subdomain
        if: steps.credentials.outputs.configured == 'true' && matrix.app == 'web'
        id: workers-subdomain
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          )"
          subdomain="$(
            RESPONSE="$response" node --input-type=module <<'NODE'
          const response = JSON.parse(process.env.RESPONSE ?? "{}");
          const subdomain = response?.result?.subdomain;

          if (!response.success || typeof subdomain !== "string" || subdomain.length === 0) {
            throw new Error(`Cloudflare workers.dev subdomain lookup failed: ${JSON.stringify(response.errors ?? [])}`);
          }

          process.stdout.write(subdomain);
          NODE
          )"
          echo "workers_dev_subdomain=${subdomain}" >> "$GITHUB_OUTPUT"

      - name: Prepare preview Wrangler config
        id: prepare
        env:
          CF_PREVIEW_WORKERS_SUBDOMAIN: ${{ steps.workers-subdomain.outputs.workers_dev_subdomain }}
          PREVIEW_APP: ${{ matrix.app }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: node scripts/01-prepare-preview-deploy.mjs --app "$PREVIEW_APP" --pr-number "$PR_NUMBER"

      - name: Comment unconfigured preview
        if: steps.credentials.outputs.configured != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_APP: ${{ matrix.app }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PREVIEW_STATUS: unconfigured
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKER_NAME: ${{ steps.prepare.outputs.worker_name }}
        run: node scripts/03-upsert-preview-comment.mjs

      - name: Deploy preview Worker
        if: steps.credentials.outputs.configured == 'true'
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .memory
          pnpm exec wrangler deploy \
            --config "${{ steps.prepare.outputs.preview_config_path }}" \
            --keep-vars \
            --no-x-provision \
            --message "PR #${{ github.event.pull_request.number || inputs.pr_number }} ${{ matrix.app }} preview ${{ github.event.pull_request.head.sha || github.sha }}" \
            2>&1 | tee ".memory/wrangler-${{ matrix.app }}-preview-deploy.log"

      - name: Extract preview URL
        if: steps.credentials.outputs.configured == 'true'
        id: preview-url
        run: |
          node scripts/02-extract-preview-url.mjs \
            ".memory/wrangler-${{ matrix.app }}-preview-deploy.log" \
            --worker-name "${{ steps.prepare.outputs.worker_name }}"

      - name: Comment preview URL
        if: steps.credentials.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_APP: ${{ matrix.app }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PREVIEW_STATUS: ready
          PREVIEW_URL: ${{ steps.preview-url.outputs.preview_url }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKER_NAME: ${{ steps.prepare.outputs.worker_name }}
        run: node scripts/03-upsert-preview-comment.mjs

      - name: Comment preview failure
        if: failure() && steps.credentials.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_APP: ${{ matrix.app }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PREVIEW_STATUS: failed
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKER_NAME: ${{ steps.prepare.outputs.worker_name }}
        run: node scripts/03-upsert-preview-comment.mjs

  cleanup-preview:
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.action == 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'cleanup')
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        app:
          - playground
          - studio
          - web
          - excalidraw
          - icons
    concurrency:
      group: app-preview-${{ matrix.app }}-pr-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Cloudflare preview cleanup credentials are not configured. Nothing was deleted."

      - name: Delete preview Worker
        if: steps.credentials.outputs.configured == 'true'
        id: cleanup
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_APP: ${{ matrix.app }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: node scripts/04-delete-preview-worker.mjs --app "$PREVIEW_APP" --pr-number "$PR_NUMBER"

      - name: Comment preview cleanup
        if: steps.credentials.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_APP: ${{ matrix.app }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PREVIEW_STATUS: deleted
          WORKER_NAME: ${{ steps.cleanup.outputs.worker_name }}
        run: node scripts/03-upsert-preview-comment.mjs
