<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Describe it. Sketchi draws it.</title>
  <desc id="description">A Sketchi deploy flow connects GitHub push, Docker build, tests pass, and Cloudflare ship steps.</desc>
  <defs>
    <pattern id="page-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1a1712" opacity="0.06"/>
    </pattern>
    <pattern id="board-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1a1712" opacity="0.075"/>
    </pattern>
    <radialGradient id="mauve-glow" cx="0" cy="0" r="1" gradientTransform="translate(1080 42) rotate(146) scale(470 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8f707f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8f707f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#281f0c" flood-opacity="0.10"/>
    </filter>
    <filter id="node-shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#1a1712" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1.5 8 5 1 8.5" fill="none" stroke="#6a4e5c" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#f6f1e7"/>
  <rect width="1200" height="630" fill="url(#page-dots)"/>
  <rect width="1200" height="630" fill="url(#mauve-glow)"/>

  <g transform="translate(60 52)">
    <rect width="64" height="64" rx="13" fill="#fffdf8" stroke="#e7ddc9" filter="url(#node-shadow)"/>
    <image x="10" y="10" width="44" height="44" xlink:href="data:image/svg+xml;base64,"/>
    <text x="82" y="49" fill="#1a1712" font-family="Dancing Script" font-size="49" font-weight="700">Sketchi</text>
  </g>

  <text x="60" y="226" fill="#1a1712" font-family="Bricolage Grotesque" font-size="58" font-weight="700" letter-spacing="-1.6">
    <tspan x="60">Describe it.</tspan>
    <tspan x="60" dy="66" fill="#6a4e5c">Sketchi draws it.</tspan>
  </text>
  <path d="M60 300 C158 295 284 297 500 293" fill="none" stroke="#8f707f" stroke-linecap="round" stroke-width="6"/>
  <text x="62" y="346" fill="#4c4639" font-family="IBM Plex Mono" font-size="17" font-weight="600" letter-spacing="0.2">PROMPT → CLEAN, EDITABLE DIAGRAM</text>

  <g filter="url(#soft-shadow)">
    <rect x="535" y="106" width="605" height="466" rx="18" fill="#fffdf8" stroke="#d8ccb1" stroke-width="2"/>
  </g>
  <path d="M535 160 H1140" stroke="#e7ddc9" stroke-width="2"/>
  <circle cx="562" cy="133" r="5" fill="#8f707f"/>
  <circle cx="580" cy="133" r="5" fill="#d8ccb1"/>
  <circle cx="598" cy="133" r="5" fill="#d8ccb1"/>
  <text x="1120" y="139" text-anchor="end" fill="#8a8270" font-family="IBM Plex Mono" font-size="13" font-weight="600">deploy-flow.sketchi</text>

  <g transform="translate(558 178)">
    <rect width="559" height="62" rx="10" fill="#fbf7ee" stroke="#e7ddc9"/>
    <path d="m23 36 3-11 9-9 6 6-9 9-9 3Z" fill="none" stroke="#8f707f" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
    <path d="m34 17 6 6" stroke="#8f707f" stroke-width="2"/>
    <text x="54" y="39" fill="#1a1712" font-family="IBM Plex Mono" font-size="16" font-weight="600">Diagram our deploy pipeline</text>
  </g>

  <rect x="558" y="260" width="559" height="288" rx="12" fill="#f6f1e7"/>
  <rect x="558" y="260" width="559" height="288" rx="12" fill="url(#board-dots)"/>

  <g fill="none" stroke="#6a4e5c" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" marker-end="url(#arrow)">
    <path d="M725 323 C756 318 782 318 811 323"/>
    <path d="M875 352 C874 370 874 383 875 397"/>
    <path d="M932 442 C954 438 975 438 997 442"/>
    <path d="M818 442 H762 C749 442 742 434 742 421 V339 C742 329 752 323 764 323 H811"/>
  </g>

  <text x="958" y="425" fill="#6a4e5c" font-family="Dancing Script" font-size="22" font-weight="700" transform="rotate(-5 958 425)">yes</text>
  <text x="714" y="414" fill="#8a8270" font-family="Dancing Script" font-size="22" font-weight="700" transform="rotate(-6 714 414)">no</text>

  <g filter="url(#node-shadow)">
    <rect x="600" y="294" width="125" height="58" rx="10" fill="#fffdf8" stroke="#1a1712" stroke-width="2" transform="rotate(-1 662.5 323)"/>
    <image x="614" y="309" width="28" height="28" xlink:href="data:image/svg+xml;base64,"/>
    <text x="652" y="330" fill="#1a1712" font-family="IBM Plex Mono" font-size="16" font-weight="600">push</text>
  </g>

  <g filter="url(#node-shadow)">
    <rect x="811" y="294" width="128" height="58" rx="10" fill="#fffdf8" stroke="#1a1712" stroke-width="2" transform="rotate(1 875 323)"/>
    <image x="825" y="309" width="28" height="28" xlink:href="data:image/svg+xml;base64,"/>
    <text x="863" y="330" fill="#1a1712" font-family="IBM Plex Mono" font-size="16" font-weight="600">build</text>
  </g>

  <g filter="url(#node-shadow)">
    <rect x="835" y="402" width="80" height="80" rx="10" fill="#efe6ec" stroke="#8f707f" stroke-width="2" transform="rotate(45 875 442)"/>
  </g>
  <text x="875" y="438" text-anchor="middle" fill="#6a4e5c" font-family="IBM Plex Mono" font-size="14" font-weight="600">
    <tspan x="875">tests</tspan><tspan x="875" dy="17">pass?</tspan>
  </text>

  <g filter="url(#node-shadow)">
    <rect x="997" y="413" width="102" height="58" rx="10" fill="#fffdf8" stroke="#1c7a4d" stroke-width="2" transform="rotate(-1 1048 442)"/>
    <image x="1010" y="428" width="28" height="28" xlink:href="data:image/svg+xml;base64,"/>
    <text x="1047" y="449" fill="#1a1712" font-family="IBM Plex Mono" font-size="16" font-weight="600">ship</text>
  </g>
</svg>
