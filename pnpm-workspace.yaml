packages:
  - "apps/*"
  - "packages/*"
  - "packages/*/*"
  - "tools/*"

saveExact: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
pmOnFail: error

overrides:
  # Raise vulnerable or stale transitive lines within bounded ranges.
  "lodash-es@>=4.0.0 <4.18.1": 4.18.1
  "nanoid@>=3.0.0 <3.3.18": 3.3.18
  "nanoid@>=4.0.0 <5.1.16": 5.1.16
  "smol-toml@>=1.0.0 <1.9.1": 1.9.1
  "brace-expansion@>=5.0.0 <5.0.12": 5.0.12
  "katex@>=0.0.0 <0.19.1": 0.19.1
  "sharp@>=0.34.0 <0.35.5": 0.35.5

allowBuilds:
  "@mongodb-js/zstd": false
  "@parcel/watcher": false
  "@swc/core": true
  core-js-pure: false
  esbuild: true
  msgpackr-extract: false
  node-liblzma: false
  nx: true
  sharp: true
  unrs-resolver: true
  workerd: true
