packages:
  - "apps/*"
  - "packages/*"
  - "packages/*/*"
  - "tools/*"

saveExact: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
pmOnFail: error

overrides:
  # Bound security overrides to affected transitive lines.
  "lodash-es@>=4.0.0 <4.18.1": 4.18.1
  "nanoid@>=3.0.0 <3.3.18": 3.3.18
  "nanoid@>=4.0.0 <5.1.16": 5.1.16
  "smol-toml@>=1.0.0 <1.9.0": 1.9.0
  "brace-expansion@>=5.0.0 <5.0.12": 5.0.12
  "axios@>=1.0.0 <1.20.0": 1.20.0
  "katex@>=0.0.0 <0.18.2": 0.18.2
  "sharp@>=0.34.0 <0.35.5": 0.35.5
  "@modelcontextprotocol/client@>=2.0.0 <2.2.0": 2.2.0
  # agents 0.26's Babel 8 decorator dependency conflicts with Vite's Babel 7
  # React transform. Babel 7.29 supports the same 2023-11 decorator proposal.
  "agents@0.26.0>@babel/plugin-proposal-decorators": 7.29.7

allowBuilds:
  "@mongodb-js/zstd": false
  "@parcel/watcher": false
  "@swc/core": true
  core-js-pure: false
  esbuild: true
  msgpackr-extract: false
  node-liblzma: false
  nx: true
  sharp: true
  unrs-resolver: true
  workerd: true
